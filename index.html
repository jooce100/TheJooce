// STORAGE SHIM — replaces the Claude-artifact-only window.storage API with a
// localStorage-backed equivalent so this file works as a true standalone page.
// ---------------------------------------------------------------------------
window.storage = {
  async get(key) {
    const raw = localStorage.getItem(key);
    if (raw === null) throw new Error("key not found: " + key);
    return { key, value: raw, shared: false };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys, prefix };
  },
};

// LEAGUE SCORING — 0.5-pt PPR (half-PPR), 4-pt passing TD, 6-pt rushing/receiving TD.
// Half-PPR is close to standard scoring — it's the base-rank rankings (sourced

// So the correction here is mild and runs the OPPOSITE direction from a
// hyper-PPR league: rush-heavy/early-down backs get a small bump relative to
// the full-PPR baseline, and pure pass-catchers (TE, WR, receiving backs) get
// a small discount. Since full weekly target/catch projections aren't loaded,
// this stays a role-based heuristic — directional guidance, not gospel. Check
// current target-share news on volatile backfields before you pick.
// ---------------------------------------------------------------------------
const RB_RECEIVING_ROLE = {
  high: [
    "Christian McCaffrey","Alvin Kamara","De'Von Achane","James Cook","Breece Hall",

    "Blake Corum","Tank Bigsby","Brian Robinson Jr.","MarShawn Lloyd","Kaytron Allen",
  ],
};
const RB_ROLE_LOOKUP = {};
RB_RECEIVING_ROLE.high.forEach((n) => { RB_ROLE_LOOKUP[n] = "high"; });
RB_RECEIVING_ROLE.low.forEach((n) => { RB_ROLE_LOOKUP[n] = "low"; });

function pprAdjustment(p) {
  if (p.pos === "QB") return 0;    // no PPR exposure either way — no adjustment needed
  if (p.pos === "TE") return -3;   // catch-dependent; base rank runs slightly hot for half-PPR
  if (p.pos === "WR") return -2;   // mild discount off the full-PPR baseline
  if (p.pos === "RB") {
    const role = RB_ROLE_LOOKUP[p.name];
    if (role === "high") return -3; // pass-catching back — mild discount vs full-PPR baseline
    if (role === "low") return 4;   // early-down/goal-line rusher — mild bump vs full-PPR baseline
    return 0;
  }
  return 0;
}

// ---------------------------------------------------------------------------
// DRAFT-CAPITAL RESEARCH — historical patterns pulled from published ADP/
// finish studies (Sharp Football Analysis, RotoWire, CBS Sports, Yahoo,
// FantasyPros — 2015-2025 samples). Two findings drive this adjustment:
//  1. Over the last 5 seasons, the average draft slot spent on the eventual
//     #1-overall-finishing QB was pick 119 (round 10+) — paying up early at
//     QB has been a historically bad trade.
//  2. QBs with 100+ rush attempts in a season hit top-12 fantasy QB numbers
//     93% of the time (26 of 28 over the last decade) — rushing floor is
//     close to a guarantee, regardless of draft slot.
// So: all QBs get a mild discount early, rushing QBs get a bigger offsetting
// bonus, and the discount eases off after round 8 — the historical point
// where late-round QB value actually starts to hit.
// ---------------------------------------------------------------------------
const QB_RUSHING_PROFILE = [
  "Josh Allen","Lamar Jackson","Jayden Daniels","Jalen Hurts","Kyler Murray",
  "Drake Maye","Bo Nix","Caleb Williams","Jaxson Dart",
];

function qbAdjustment(p, currentRound) {
  if (p.pos !== "QB") return 0;
  const rushBonus = QB_RUSHING_PROFILE.includes(p.name) ? 14 : 0;
  const earlyPenalty = currentRound <= 8 ? -10 : 0;
  return rushBonus + earlyPenalty;
}

          setPickOrder(data.pickOrder || []);
          setCustomPlayers(data.customPlayers || []);

  const undraftPlayer = (id) => {
    setBoard((b) => { const n = { ...b }; delete n[id]; return n; });
    setPickOrder((o) => o.filter((x) => x !== id));

  const undoLastPick = () => {
    setPickOrder((o) => {
      if (o.length === 0) return o;
      const lastId = o[o.length - 1];

    () => pickOrder.filter((id) => board[id] === "me").map((id) => allPlayers.find((p) => p.id === id)).filter(Boolean),

  const myCounts = useMemo(() => {

    const used = new Set();
    const need = { QB: rosterSettings.QB, RB: rosterSettings.RB, WR: rosterSettings.WR, TE: rosterSettings.TE };
    const filled = { QB: [], RB: [], WR: [], TE: [] };
    myRosterPlayers.forEach((p) => {
      if (need[p.pos] !== undefined && filled[p.pos].length < need[p.pos]) { filled[p.pos].push(p); used.add(p.id); }
    });
    const flex = [];
    for (const p of myRosterPlayers) {
      if (flex.length >= rosterSettings.FLEX) break;
      if (!used.has(p.id) && FLEX_ELIGIBLE.includes(p.pos)) { flex.push(p); used.add(p.id); }

      QB: Math.min(myCounts.QB || 0, rosterSettings.QB),
      RB: Math.min(myCounts.RB || 0, rosterSettings.RB),
      WR: Math.min(myCounts.WR || 0, rosterSettings.WR),
      TE: Math.min(myCounts.TE || 0, rosterSettings.TE),
    };
    const flexUsed = Math.max(0, (myCounts.RB || 0) - rosterSettings.RB + (myCounts.WR || 0) - rosterSettings.WR + (myCounts.TE || 0) - rosterSettings.TE);
    const flexNeed = flexUsed >= rosterSettings.FLEX ? 0 : 1;
    const score = {};
    ["QB", "RB", "WR", "TE"].forEach((pos) => {
      const starterGap = rosterSettings[pos] - filledStarters[pos];
      let s = 0;
      if (starterGap > 0) s += 55;
      else if (FLEX_ELIGIBLE.includes(pos) && flexNeed > 0) s += 25;
      const total = myCounts[pos] || 0;
      if (total >= (pos === "QB" || pos === "TE" ? 3 : 5)) s -= 25;
      score[pos] = s;
    });
    score.DST = (myCounts.DST || 0) < rosterSettings.DST ? 15 : -30;
    return score;
  }, [myCounts, rosterSettings]);

  const recommendations = useMemo(() => {
    const scored = availablePlayers
      .filter((p) => p.rank < 9999)
      .map((p) => ({ ...p, adj: p.rank - (needScore[p.pos] || 0) - pprAdjustment(p) - qbAdjustment(p, currentRound) }))
      .sort((a, b) => a.adj - b.adj);
    return scored.slice(0, 5);
  }, [availablePlayers, needScore, currentRound]);


  const scarcity = useMemo(() => {
    const s = { QB: 0, RB: 0, WR: 0, TE: 0 };
    availablePlayers.forEach((p) => { if (p.rank <= 60 && s[p.pos] !== undefined) s[p.pos] += 1; });
    return s;
  }, [availablePlayers]);

  const filteredList = useMemo(() => {
    let list = allPlayers;
    if (hideDrafted) list = list.filter((p) => !drafted[p.id]);
    if (posFilter !== "ALL") list = list.filter((p) => p.pos === posFilter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter((p) => p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q));
    }
    return [...list].sort((a, b) => a.rank - b.rank);
  }, [allPlayers, hideDrafted, posFilter, query, drafted]);

  const round = currentRound;
  const pickInRound = (totalPicks % teams) + 1;
  const lastPicked = totalPicks > 0 ? allPlayers.find((p) => p.id === pickOrder[totalPicks - 1]) : null;

  return (
    <div style={{ background: BG, minHeight: "100vh", fontFamily: "'Roboto', 'Helvetica Neue', Arial, sans-serif", color: TEXT }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700;900&display=swap');
        .hdln { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        .tab { font-variant-numeric: tabular-nums; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #C3C9CF; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #0057B8; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        input, select { font-family: inherit; }
      `}</style>

      {/* TOP NAV BAR */}
      <div style={{ background: NAVY, borderBottom: `3px solid ${RED}` }}>
        <div style={{ maxWidth: 1400, margin: "0 auto", padding: "12px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 26, height: 26, background: RED, borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Radio size={15} color="#fff" />
            </div>
            <span className="hdln" style={{ fontSize: 20, fontWeight: 700, color: "#fff", letterSpacing: "0.02em" }}>Slug Drafter</span>
            <span className="hdln" style={{ fontSize: 11, color: "#9FB0CC", fontWeight: 500, letterSpacing: "0.08em", borderLeft: "1px solid #2E4373", paddingLeft: 10, marginLeft: 2 }}>2026 FANTASY DRAFT TRACKER</span>
          </div>
          <div style={{ display: "flex", gap: 16, fontSize: 12, color: "#C7D2E8", alignItems: "center", flexWrap: "wrap" }} className="tab">
            <span>TEAMS
              <input type="text" inputMode="numeric" value={teamsInput}
                onChange={(e) => {
                  const v = e.target.value.replace(/[^0-9]/g, "");
                  setTeamsInput(v);
                  if (v !== "") { const n = Number(v); if (n >= 1) setTeams(Math.min(20, n)); }
                }}
                onBlur={() => { const n = Math.max(2, Math.min(20, Number(teamsInput) || 12)); setTeams(n); setTeamsInput(String(n)); }}
                style={{ width: 34, marginLeft: 6, background: NAVY_LIGHT, border: "1px solid #2E4373", color: "#fff", borderRadius: 4, padding: "2px 4px", textAlign: "center" }} />
            </span>
            <span>ROUND <b style={{ color: "#fff" }}>{round}</b>&nbsp; PICK <b style={{ color: "#fff" }}>{pickInRound}</b></span>
            <span>TOTAL <b style={{ color: "#fff" }}>{totalPicks}</b></span>
            <button onClick={undoLastPick} disabled={!lastPicked} title={lastPicked ? `Undo: ${lastPicked.name}` : "No picks yet"}
              style={{ display: "flex", alignItems: "center", gap: 4, fontWeight: 600, background: "#132A54", border: "1px solid #2E4373", color: lastPicked ? "#fff" : "#5A6E96", borderRadius: 4, padding: "5px 10px", cursor: lastPicked ? "pointer" : "not-allowed" }}>
              <RotateCcw size={12} /> Undo{lastPicked ? `: ${lastPicked.name}` : ""}
            </button>
            <button onClick={resetDraft} style={{ display: "flex", alignItems: "center", gap: 4, fontWeight: 600, background: RED, border: "none", color: "#fff", borderRadius: 4, padding: "5px 10px", cursor: "pointer" }}>
              <RotateCcw size={12} /> Reset
            </button>
          </div>
        </div>
      </div>

      {/* ON THE CLOCK STRIP */}
      {recommendations.length > 0 && (
        <div style={{ background: NAVY_LIGHT }}>
          <div style={{ maxWidth: 1400, margin: "0 auto", padding: "14px 20px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <span style={{ background: RED, color: "#fff", fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 3, letterSpacing: "0.05em" }} className="hdln">ON THE CLOCK</span>
              <span className="hdln" style={{ fontSize: 13, color: "#C7D2E8", fontWeight: 600, letterSpacing: "0.03em" }}>RECOMMENDED — WEIGHTED FOR YOUR ROSTER NEEDS</span>
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "stretch" }}>
              {recommendations.map((p, i) => (
                <div key={p.id} style={{
                  background: i === 0 ? "#fff" : "#1E3A6B",
                  borderTop: i === 0 ? `3px solid ${RED}` : "3px solid transparent",
                  borderRadius: 4, padding: "10px 14px", minWidth: 150, flex: i === 0 ? "1 1 220px" : "0 1 150px"
                }}>
                  <div className="tab" style={{ fontSize: 11, color: i === 0 ? MUTED : "#9FB0CC", fontWeight: 700 }}>RK #{p.rank}{i === 0 ? " · TOP PICK" : ""}</div>
                  <div style={{ fontWeight: 700, fontSize: i === 0 ? 17 : 14, margin: "2px 0", color: i === 0 ? TEXT : "#fff" }}>{p.name}</div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <PosBadge pos={p.pos} />
                    <span className="tab" style={{ fontSize: 11, color: i === 0 ? MUTED : "#9FB0CC", fontWeight: 700 }}>{p.team}</span>
                  </div>
                  <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                    <ActionBtn label="Draft to Me" color={BLUE} onClick={() => draftPlayer(p.id, "me")} />
                    <ActionBtn label="Taken" color={RED} onClick={() => draftPlayer(p.id, "other")} />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <div style={{ maxWidth: 1400, margin: "0 auto", padding: "20px" }}>
        {/* PRIMARY: available players board */}
        <SectionHeader label="Available Players" />
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }}>
          <div style={{ position: "relative", flex: "1 1 220px" }}>
            <Search size={14} color={MUTED} style={{ position: "absolute", left: 10, top: 11 }} />
            <input placeholder="Search player or team..." value={query} onChange={(e) => setQuery(e.target.value)} style={{ ...inputStyle, width: "100%", paddingLeft: 30 }} />
          </div>
          <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
            {["ALL", "QB", "RB", "WR", "TE", "DST"].map((p) => (
              <button key={p} onClick={() => setPosFilter(p)} className="hdln" style={{
                padding: "7px 13px", borderRadius: 4, cursor: "pointer", fontSize: 12, fontWeight: 600,
                border: `1px solid ${posFilter === p ? NAVY : BORDER}`,
                background: posFilter === p ? NAVY : "#fff",
                color: posFilter === p ? "#fff" : MUTED
              }}>{p}</button>
            ))}
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: MUTED, cursor: "pointer" }}>
            <input type="checkbox" checked={hideDrafted} onChange={(e) => setHideDrafted(e.target.checked)} />
            Hide drafted
          </label>
        </div>

        <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 6, overflow: "hidden", boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
          <div className="hdln" style={{ display: "grid", gridTemplateColumns: "50px 1fr 70px 64px 190px", padding: "10px 14px", background: NAVY, fontSize: 11, color: "#fff", fontWeight: 600, letterSpacing: "0.04em" }}>
            <span>RK</span><span>PLAYER</span><span>TEAM</span><span>POS</span><span style={{ textAlign: "right" }}>ACTION</span>
          </div>
          <div style={{ maxHeight: 640, overflowY: "auto" }}>
            {filteredList.length === 0 && (<div style={{ padding: 24, textAlign: "center", color: MUTED, fontSize: 13 }}>No players match.</div>)}
            {filteredList.map((p, idx) => {
              const who = drafted[p.id];
              return (
                <div key={p.id} style={{
                  display: "grid", gridTemplateColumns: "50px 1fr 70px 64px 190px", padding: "9px 14px", alignItems: "center", fontSize: 13,
                  borderTop: `1px solid ${BORDER}`,
                  opacity: who ? 0.55 : 1,
                  background: who === "me" ? "#E8F1FC" : who === "other" ? "#FBEAEA" : (idx % 2 === 0 ? "#fff" : "#F7F8FA"),
                }}>
                  <span className="tab" style={{ color: MUTED, fontWeight: 700 }}>{p.rank < 9999 ? p.rank : "—"}</span>
                  <span style={{ fontWeight: 700, display: "flex", alignItems: "center", gap: 5, color: TEXT }}>
                    {p.name}
                    {p.injury && (<span title={p.injury} style={{ display: "inline-flex" }}><AlertTriangle size={12} color="#D97706" /></span>)}
                    {p.pos === "RB" && RB_ROLE_LOOKUP[p.name] === "low" && (
                      <span title="Early-down/goal-line runner — mild bump for half-PPR" style={{ color: GREEN, fontSize: 11, fontWeight: 700 }}>▲PPR</span>
                    )}
                    {p.pos === "RB" && RB_ROLE_LOOKUP[p.name] === "high" && (
                      <span title="Pass-catching back — mild discount for half-PPR" style={{ color: RED, fontSize: 11, fontWeight: 700 }}>▼PPR</span>
                    )}
                    {p.pos === "QB" && QB_RUSHING_PROFILE.includes(p.name) && (
                      <span title="100+ rush attempts historically hits top-12 QB numbers 93% of the time" style={{ color: GREEN, fontSize: 11, fontWeight: 700 }}>🏃RUSH</span>
                    )}
                  </span>
                  <span className="tab" style={{ color: MUTED, fontWeight: 600 }}>{p.team}</span>
                  <PosBadge pos={p.pos} />
                  <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                    {!who ? (
                      <>
                        <ActionBtn label="Mine" color={BLUE} onClick={() => draftPlayer(p.id, "me")} />
                        <ActionBtn label="Taken" color={RED} onClick={() => draftPlayer(p.id, "other")} />
                      </>
                    ) : (
                      <button onClick={() => undraftPlayer(p.id)} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 600, background: "#fff", border: `1px solid ${BORDER}`, color: MUTED, borderRadius: 4, padding: "4px 8px", cursor: "pointer" }}>
                        <X size={11} /> {who === "me" ? "On my team" : "Drafted"} · undo
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* SELECTED PLAYER POOL */}
        <SectionHeader label={`Selected Players (${totalPicks})`} />
        {totalPicks === 0 ? (
          <div style={{ color: MUTED, fontSize: 13, background: CARD, border: `1px dashed ${BORDER}`, borderRadius: 6, padding: 16 }}>
            No picks yet. Players you mark "Mine" or "Taken" will show up here for quick correction.
          </div>
        ) : (
          <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 6, overflow: "hidden", boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
            <div style={{ maxHeight: 260, overflowY: "auto" }}>
              {[...pickOrder].reverse().map((id, idx) => {
                const p = allPlayers.find((pl) => pl.id === id);
                if (!p) return null;
                const who = board[id];
                return (
                  <div key={id} style={{
                    display: "grid", gridTemplateColumns: "44px 1fr 60px 60px 90px 32px", padding: "8px 14px", alignItems: "center", fontSize: 13,
                    borderTop: `1px solid ${BORDER}`,
                    background: who === "me" ? "#E8F1FC" : "#FBEAEA",
                  }}>
                    <span className="tab" style={{ color: MUTED, fontSize: 11, fontWeight: 700 }}>{p.rank < 9999 ? `#${p.rank}` : "—"}</span>
                    <span style={{ fontWeight: 700, color: TEXT }}>{p.name}</span>
                    <span className="tab" style={{ color: MUTED, fontSize: 11, fontWeight: 600 }}>{p.team}</span>
                    <PosBadge pos={p.pos} small />
                    <span className="hdln" style={{ fontSize: 10, fontWeight: 700, textAlign: "center", color: who === "me" ? BLUE : RED }}>{who === "me" ? "MY TEAM" : "TAKEN"}</span>
                    <button onClick={() => undraftPlayer(id)} title="Remove — undo this pick" style={{ background: "#fff", border: `1px solid ${BORDER}`, color: MUTED, borderRadius: 4, padding: "3px 6px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", marginLeft: "auto" }}>
                      <X size={13} />
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* MY TEAM */}
        <SectionHeader label="My Team" />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 14 }}>
          <Panel title="League Scoring" icon={<TrendingUp size={15} color={RED} />}>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 12 }}>
              <ScoringRow label="Reception" value="0.5 PT" />
              <ScoringRow label="Passing TD" value="4 PT" />
              <ScoringRow label="Rush / Rec TD" value="6 PT" />
            </div>
            <div style={{ fontSize: 11, color: MUTED, marginTop: 10, lineHeight: 1.4 }}>
              Half-PPR is close to standard scoring. Since base rankings run on full PPR, recommendations apply a mild opposite correction: rush-heavy backs get a small bump, pure pass-catchers (TE/WR/receiving RBs) get a small discount. Look for <span style={{ color: GREEN, fontWeight: 700 }}>▲PPR</span> / <span style={{ color: RED, fontWeight: 700 }}>▼PPR</span> tags on RB rows below.
            </div>
          </Panel>

          <Panel title="Draft Strategy Notes" icon={<TrendingUp size={15} color={RED} />}>
            <div style={{ fontSize: 11, color: MUTED, marginBottom: 8, lineHeight: 1.4 }}>
              Patterns from 5+ years of published ADP-vs-finish research (Sharp Football, RotoWire, CBS, Yahoo, FantasyPros) baked into the recommendations:
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <NoteRow tag="QB" color="#7C3AED" text={"Paying up early at QB has historically been a bad trade — the average draft slot for the last 5 seasons' #1-finishing QB was pick 119 (round 10+). Rushing QBs are the exception: 100+ rush attempts hits top-12 numbers 93% of the time. Recommendations discount QB early, ease off after round 8, and boost the tagged 🏃RUSH QBs throughout."} />
              <NoteRow tag="RB" color="#16A34A" text="Elite RB production is front-loaded: since 2015, 31 of 33 RBs who hit 20+ PPG came from Rounds 1-2. In the RB2 'dead zone,' youth wins — 61% of value hits since 2010 were rookie-contract backs." />
              <NoteRow tag="WR" color="#0057B8" text="WR's reputation as the 'safe' pick has been slipping — last season had the weakest ADP-to-scoring correlation for top WRs since 2010. Don't reach out of habit." />
              <NoteRow tag="TE" color="#EA580C" text="Still a cliff after the top tier. A handful of difference-makers, then heavy touchdown randomness — the scarcity meter above is your best guide here." />
            </div>
          </Panel>

          <Panel title="Roster Settings" icon={<Users size={15} color={RED} />}>
            <div style={{ fontSize: 11, color: MUTED, marginBottom: 8 }}>Set your league's starting lineup — the roster below and recommendations update to match.</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              {["QB", "RB", "WR", "TE", "FLEX", "DST"].map((key) => (
                <label key={key} className="tab" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 11, color: MUTED, fontWeight: 700 }}>
                  {key}
                  <input type="text" inputMode="numeric" value={rosterInputs[key]}
                    onChange={(e) => { const v = e.target.value.replace(/[^0-9]/g, ""); setRosterInputs((r) => ({ ...r, [key]: v })); }}
                    onBlur={(e) => commitRosterSetting(key, e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
                    style={{ width: 36, marginLeft: 6, background: "#fff", border: `1px solid ${BORDER}`, color: TEXT, borderRadius: 4, padding: "2px 4px", textAlign: "center" }} />
                </label>
              ))}
            </div>
          </Panel>

          <Panel title="My Roster" icon={<Trophy size={15} color={RED} />}>
            <RosterSlot label="QB" players={rosterView.filled.QB} need={rosterSettings.QB} onUndo={undraftPlayer} />
            <RosterSlot label="RB" players={rosterView.filled.RB} need={rosterSettings.RB} onUndo={undraftPlayer} />
            <RosterSlot label="WR" players={rosterView.filled.WR} need={rosterSettings.WR} onUndo={undraftPlayer} />
            <RosterSlot label="TE" players={rosterView.filled.TE} need={rosterSettings.TE} onUndo={undraftPlayer} />
            <RosterSlot label="FLEX" players={rosterView.flex} need={rosterSettings.FLEX} onUndo={undraftPlayer} />
            <RosterSlot label="DEF" players={rosterView.dst} need={rosterSettings.DST} onUndo={undraftPlayer} />
            <div style={{ marginTop: 8, paddingTop: 8, borderTop: `1px dashed ${BORDER}` }}>
              <div className="tab" style={{ fontSize: 11, color: MUTED, fontWeight: 700, marginBottom: 6 }}>BENCH ({rosterView.bench.length})</div>
              {rosterView.bench.length === 0 && <div style={{ fontSize: 12, color: "#9CA3AF" }}>—</div>}
              {rosterView.bench.map((p) => (
                <div key={p.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, padding: "3px 0" }}>
                  <span style={{ color: TEXT }}>{p.name}</span>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <PosBadge pos={p.pos} small />
                    <button onClick={() => undraftPlayer(p.id)} title="Undo pick" style={{ background: "none", border: "none", color: MUTED, cursor: "pointer", padding: 2, display: "flex" }}><X size={12} /></button>
                  </div>
                </div>
              ))}
            </div>
          </Panel>

          <Panel title="Positional Scarcity" icon={<AlertTriangle size={15} color={RED} />}>
            <div style={{ fontSize: 11, color: MUTED, marginBottom: 8 }}>Available players still ranked in the overall Top 60</div>
            {["QB", "RB", "WR", "TE"].map((pos) => (
              <div key={pos} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <PosBadge pos={pos} />
                <div style={{ flex: 1, background: "#EDEEF0", border: `1px solid ${BORDER}`, borderRadius: 4, height: 8, overflow: "hidden" }}>
                  <div style={{ width: `${Math.min(100, (scarcity[pos] / 15) * 100)}%`, height: "100%", background: scarcity[pos] <= 2 ? RED : scarcity[pos] <= 5 ? "#D97706" : GREEN }} />
                </div>
                <span className="tab" style={{ fontSize: 12, width: 18, textAlign: "right", fontWeight: 700, color: TEXT }}>{scarcity[pos]}</span>
              </div>
            ))}
          </Panel>

          <Panel title="Add Custom Player" icon={<Plus size={15} color={RED} />}>
            {!showAddPlayer ? (
              <button onClick={() => setShowAddPlayer(true)} style={{ width: "100%", background: "#F7F8FA", border: `1px dashed ${BORDER}`, color: MUTED, borderRadius: 4, padding: "8px", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>+ Add player not on the board (K, DST, sleeper)</button>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <input placeholder="Player name" value={newPlayer.name} onChange={(e) => setNewPlayer((n) => ({ ...n, name: e.target.value }))} style={inputStyle} />
                <div style={{ display: "flex", gap: 6 }}>
                  <input placeholder="Team" value={newPlayer.team} onChange={(e) => setNewPlayer((n) => ({ ...n, team: e.target.value }))} style={{ ...inputStyle, width: 70 }} />
                  <select value={newPlayer.pos} onChange={(e) => setNewPlayer((n) => ({ ...n, pos: e.target.value }))} style={{ ...inputStyle, flex: 1 }}>
                    {["QB", "RB", "WR", "TE", "DST"].map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={addCustomPlayer} style={{ ...smallBtn, background: BLUE }}>Add</button>
                  <button onClick={() => setShowAddPlayer(false)} style={{ ...smallBtn, background: MUTED }}>Cancel</button>
                </div>
              </div>
            )}
          </Panel>
        </div>
      </div>
    </div>
  );
}

function NoteRow({ tag, color, text }) {
  return (
    <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
      <span className="hdln" style={{ fontSize: 10, fontWeight: 700, color: "#fff", background: color, borderRadius: 3, padding: "2px 6px", flexShrink: 0, marginTop: 1 }}>{tag}</span>
      <span style={{ fontSize: 11.5, color: "#14171A", lineHeight: 1.4 }}>{text}</span>
    </div>
  );
}

function ScoringRow({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "4px 8px", background: "#F7F8FA", border: "1px solid #DADFE3", borderRadius: 4 }}>
      <span style={{ color: "#14171A", fontWeight: 600 }}>{label}</span>
      <span className="tab" style={{ color: "#D50A0A", fontWeight: 700 }}>{value}</span>
    </div>
  );
}

function SectionHeader({ label }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "24px 0 12px" }}>
      <div style={{ width: 4, height: 16, background: "#D50A0A" }} />
      <span className="hdln" style={{ fontSize: 16, fontWeight: 700, color: "#0B1C3D", letterSpacing: "0.02em" }}>{label}</span>
    </div>
  );
}

function Panel({ title, icon, children }) {
  return (
    <div style={{ background: "#FFFFFF", border: "1px solid #DADFE3", borderRadius: 6, padding: 14, boxShadow: "0 1px 2px rgba(0,0,0,0.04)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 10, borderBottom: "2px solid #0B1C3D", paddingBottom: 8 }}>
        {icon}
        <span className="hdln" style={{ fontSize: 13, letterSpacing: "0.03em", color: "#0B1C3D", fontWeight: 700 }}>{title}</span>
      </div>
      {children}
    </div>
  );
}

function RosterSlot({ label, players, need, onUndo }) {
  const rows = [];
  for (let i = 0; i < need; i++) rows.push(players[i] || null);
  return (
    <div style={{ marginBottom: 6 }}>
      {rows.map((p, i) => (
        <div key={i} style={{
          display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 8px", marginBottom: 3, borderRadius: 4, fontSize: 12,
          background: p ? "#F7F8FA" : "transparent",
          border: p ? "1px solid #DADFE3" : "1px dashed #C3C9CF",
        }}>
          <span className="tab" style={{ color: "#0057B8", width: 40, fontSize: 10, fontWeight: 700 }}>{label}</span>
          <span style={{ flex: 1, color: p ? "#14171A" : "#9CA3AF", fontWeight: p ? 600 : 400 }}>{p ? p.name : "Empty"}</span>
          {p && (
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <PosBadge pos={p.pos} small />
              <button onClick={() => onUndo(p.id)} title="Undo pick" style={{ background: "none", border: "none", color: "#6B7280", cursor: "pointer", padding: 2, display: "flex" }}><X size={12} /></button>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function PosBadge({ pos, small }) {
  const c = POS_COLORS[pos] || { bg: "#6B7280", text: "#fff" };
  return (
    <span className="hdln" style={{
      fontSize: small ? 9 : 10, fontWeight: 700, padding: small ? "1px 5px" : "2px 7px",
      borderRadius: 3, background: c.bg, color: c.text, whiteSpace: "nowrap"
    }}>{pos}</span>
  );
}

function ActionBtn({ label, color, onClick }) {
  return (
    <button onClick={onClick} className="hdln" style={{
      display: "flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 700,
      background: color, color: "#fff", border: "none", borderRadius: 4, padding: "5px 9px", cursor: "pointer"
    }}>
      <Check size={11} /> {label}
    </button>
  );
}

const inputStyle = {
  background: "#fff", border: "1px solid #DADFE3", color: "#14171A",
  borderRadius: 4, padding: "8px 10px", fontSize: 13,
};
const smallBtn = {
  color: "#fff", border: "none", borderRadius: 4, padding: "6px 0", cursor: "pointer",
  fontSize: 12, fontWeight: 700, flex: 1,
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DraftWarRoom />);
</script>
</body>
</html>
